<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme — Fixture landing page</title>
<style nonce="e2e">
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #0b0b0f; color: #eee; }
  section { padding: 48px 24px; max-width: 880px; margin: 0 auto; }
  .badge { text-transform: uppercase; font-size: 11px; letter-spacing: .08em; background: #222; padding: 2px 8px; border-radius: 99px; }
  .btn { display: inline-flex; gap: 8px; align-items: center; padding: 10px 16px; border-radius: 10px; background: #6d5dfc; color: #fff; border: 0; font: inherit; }
  .grad { color: #9f8bff; }
  .card { position: relative; }
  .card-link { position: absolute; inset: 0; }
  /* Hand-written stand-in for Tailwind v4 output: a site palette override and a dark: variant. */
  :root { --color-zinc-900: #1f1c19; --color-zinc-800: #2b2723; --color-accent: #9c3a22; }
  .dark { --color-accent: #cfc3a0; }
  .bg-zinc-50 { background-color: var(--color-zinc-50, oklch(98.5% 0 0)); }
  .dark\:bg-zinc-900:where(.dark, .dark *) { background-color: var(--color-zinc-900); }
  .bg-zinc-900\/50 { background-color: color-mix(in oklab, var(--color-zinc-900) 50%, transparent); }
  #side, #glass { padding: 12px 24px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
</style>
</head>
<body>
  <section id="hero">
    <span class="badge" id="badge">New feature</span>
    <h1>Ship <span class="grad">faster</span> with Acme</h1>
    <p id="sub">The platform for teams who&nbsp;ship.<br>No credit card required.</p>
    <form onsubmit="window.__submitted = true; return false;">
      <button class="btn" id="cta" type="submit"><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#fff"/></svg><span>Book a demo</span></button>
      <a href="#pricing" id="pricing-link" onclick="window.__linkClicked = true">See pricing <span class="sr-only">(opens pricing)</span></a>
    </form>
  </section>
  <aside id="side" class="dark bg-zinc-50 dark:bg-zinc-900">Sidebar</aside>
  <div id="glass" class="bg-zinc-900/50">Glass</div>
  <section id="pricing" aria-label="Pricing">
    <h2>Simple pricing</h2>
    <ul><li>Unlimited seats</li><li>SOC 2 Type II</li></ul>
    <figure><figcaption>Prices in USD.</figcaption></figure>
    <div class="card"><p id="card-copy">Trusted by 4,000 teams</p><a class="card-link" href="#customers" aria-label="Customers"></a></div>
  </section>
</body>
</html>
